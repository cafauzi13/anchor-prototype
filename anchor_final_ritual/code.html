<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                    "on-surface": "#e2e2e9",
                    "surface-container-high": "#282a2f",
                    "outline-variant": "#49454e",
                    "on-background": "#e2e2e9",
                    "tertiary": "#d2beeb",
                    "outline": "#948e99",
                    "on-tertiary-fixed-variant": "#4f4065",
                    "on-secondary-fixed-variant": "#722f54",
                    "on-tertiary": "#38294d",
                    "on-error-container": "#ffdad6",

                    "on-secondary-fixed": "#3c0127",

                    "secondary-fixed-dim": "#ffafd5",
                    "on-surface-variant": "#cbc4d0",
                    "on-tertiary-fixed": "#221437",
                    "inverse-primary": "#68558b",
                    "inverse-surface": "#e2e2e9",
                    "primary-fixed-dim": "#d2bcfa",
                    "on-primary": "#38265a",
                    "tertiary-fixed": "#eddcff",
                    "on-primary-fixed-variant": "#4f3d72",
                    "surface-tint": "#d2bcfa",
                    "error": "#ffb4ab",
                    "primary-container": "#2d1b4e",
                    "surface-container-highest": "#33353a",
                    "surface-bright": "#37393e",
                    "secondary-fixed": "#ffd8e8",
                    "on-secondary-container": "#f59ec8",
                    "secondary-container": "#753156",

          },
        },
      }
    </script>
<style>
        body {
            background: radial-gradient(circle at center, #1d2025 0%, #111318 100%);
            overflow: hidden;
        }
        .nebula-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(210,188,250,0.05) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1) translate(-20%, -20%); opacity: 0.3; }
            to { transform: scale(1.3) translate(10%, 10%); opacity: 0.6; }
        }
        .timer-ring {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .breathing-circle {
            animation: breathe 16s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            25% { transform: scale(1.5); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.8; }
            75% { transform: scale(1); opacity: 0.3; }
        }
        .glass-panel {
            background: rgba(240, 240, 247, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased min-h-screen flex flex-col items-center justify-between">
<!-- Atmospheric Background Layers -->
<div class="nebula-glow top-0 left-0"></div>
<div class="nebula-glow bottom-0 right-0" style="background: radial-gradient(circle, rgba(255,175,213,0.05) 0%, transparent 70%); animation-delay: -4s;"></div>
<!-- Top App Bar (As per Shared Components, but tailored for a task-focused screen) -->
<header class="fixed top-0 w-full flex items-center justify-between px-margin-mobile h-16 w-full z-50 backdrop-blur-xl bg-surface/5">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="waves">waves</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Anchor</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md text-on-surface-variant">Step 3 of 3</span>
<div class="w-16 h-1 bg-surface-variant rounded-full mt-1 overflow-hidden">
<div class="w-full h-full bg-primary transition-all duration-700"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-content px-margin-mobile pt-20 pb-8">
<div class="text-center mb-lg space-y-sm">
<h1 class="font-headline-xl text-headline-xl text-primary">Final Shutdown Ritual.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Focus on your breath. Follow the circle below for box breathing.</p>
</div>
<!-- Timer/Breathing Component -->
<div class="relative flex items-center justify-center w-64 h-64 md:w-80 md:h-80">
<!-- Pulsing Aura -->
<div class="breathing-circle absolute inset-0 bg-secondary/10 rounded-full blur-3xl"></div>
<!-- Glass Timer Container -->
<div class="glass-panel w-full h-full rounded-full flex items-center justify-center relative overflow-hidden">
<svg class="absolute inset-0 w-full h-full" viewbox="0 0 100 100">
<!-- Background Track -->
<circle class="text-surface-variant/30" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="2"></circle>
<!-- Progress Ring -->
<circle class="timer-ring" cx="50" cy="50" fill="none" id="progress-ring" r="45" stroke="url(#gradient)" stroke-dasharray="282.7" stroke-dashoffset="0" stroke-linecap="round" stroke-width="4"></circle>
<defs>
<lineargradient id="gradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:var(--tw-color-secondary-fixed-dim)"></stop>
<stop offset="100%" style="stop-color:var(--tw-color-primary)"></stop>
</lineargradient>
</defs>
</svg>
<!-- Time Display -->
<div class="text-center z-10">
<span class="font-headline-xl text-headline-xl block tabular-nums" id="timer-text">60</span>
<span class="font-label-md text-label-md text-on-surface-variant tracking-widest uppercase" id="breathing-instruction">Inhale</span>
</div>
</div>
</div>
<!-- Completion Message (Hidden initially) -->
<div class="opacity-0 transition-opacity duration-1000 text-center mt-lg space-y-md" id="success-message">
<div class="inline-flex items-center justify-center p-4 rounded-full bg-secondary-container/20 text-secondary shadow-[0_0_20px_rgba(255,175,213,0.1)] border border-secondary/20">
<span class="material-symbols-outlined" data-icon="nights_stay" style="font-variation-settings: 'FILL' 1;">nights_stay</span>
</div>
<h2 class="font-headline-md text-headline-md text-secondary">Otak siap shutdown.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan letakkan perangkat Anda.</p>
<button class="mt-md px-8 py-3 bg-gradient-to-r from-secondary to-primary text-on-primary font-bold rounded-full hover:opacity-90 transition-opacity active:scale-95">
                Finish Ritual
            </button>
</div>
</main>
<!-- Bottom Navigation (Suppressed per "Transactional/Task-Focused" rule, but we keep the spacing/style for branding) -->
<footer class="w-full h-8 flex justify-center items-center pointer-events-none mb-4">
<div class="w-12 h-1 bg-surface-variant rounded-full opacity-20"></div>
</footer>
<script>
        const ring = document.getElementById('progress-ring');
        const text = document.getElementById('timer-text');
        const instruction = document.getElementById('breathing-instruction');
        const success = document.getElementById('success-message');
        const circumference = 2 * Math.PI * 45;
        
        let timeLeft = 60;
        let breathingPhase = 0; // 0: Inhale, 1: Hold, 2: Exhale, 3: Hold
        const phaseLabels = ["Inhale", "Hold", "Exhale", "Hold"];

        const updateTimer = () => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                text.innerText = "0";
                ring.style.strokeDashoffset = circumference;
                showCompletion();
                return;
            }

            timeLeft--;
            text.innerText = timeLeft;
            
            // Circular progress
            const offset = circumference - (timeLeft / 60) * circumference;
            ring.style.strokeDashoffset = offset;

            // Breathing instructions (4 second cycle for box breathing)
            const cycleTime = 60 - timeLeft;
            if (cycleTime % 4 === 0) {
                breathingPhase = (breathingPhase + 1) % 4;
                instruction.innerText = phaseLabels[breathingPhase];
            }
        };

        const showCompletion = () => {
            document.querySelector('.relative.flex.items-center.justify-center').classList.add('transition-all', 'duration-1000', 'opacity-20', 'scale-90');
            success.classList.remove('opacity-0');
            success.classList.add('opacity-100');
            document.querySelector('h1').classList.add('opacity-40');
            document.querySelector('p').classList.add('opacity-40');
        };

        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body></html>
